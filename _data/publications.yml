- id: walka-rl
  title: "Walka RL Mjlab: Bipedal locomotion via reinforcement learning"
  venue:
  description: "An end-to-end reinforcement learning project for bipedal locomotion on the Walka humanoid robot using MuJoCo and mjlab. Implements two tasks (Walka-Flat and Walka-Rough) with RSL-RL PPO, terrain curriculum learning, and sixteen-term reward shaping. Trained on rented vast.ai RTX 4090 GPUs with documented vast.ai workflow, kinematic structure analysis, and reward design. Includes flat-terrain tracking, rough-terrain navigation (stairs, slopes, bumps, waves), get-up task, and keyboard-steered playtesting."
  project_page: https://thanhndv212.github.io/walka-rl-webpage/
  pdf:
  github: thanhndv212/walka_rl_mjlab
  image: walka_flat_trained.gif
  image_mouseover:
  authors:
    - thanhndv212
- id: soarm-ws
  title: "soarm-ws: A full-stack workspace for SO-ARM100 manipulator research"
  venue:
  description: "An ongoing, modular workspace for the SO-ARM100 manipulator: a thin umbrella repo over independently-versioned packages for servo/IMU transport, teleoperation, camera calibration, imitation learning (LeRobot), and reinforcement learning (mjlab/MuJoCo). Each package ships as its own git submodule with its own GitHub remote, so hardware transport, teleop, dataset recording, and simulation/RL training can evolve independently. Includes a full hardware build guide (3D-printed SO-ARM100, FEETECH servos, IMU/camera sensing) alongside the software stack."
  project_page: https://thanhndv212.github.io/soarm-ws-webpage/
  pdf:
  github: thanhndv212/soarm-ws
  image: soarm100.png
  image_mouseover:
  authors:
    - thanhndv212
- id: figaroh
  title: "Humanoid Robot Whole-body Geometric Calibration with Embedded Sensors and a Single Plane"
  venue: 
  description: "This paper presents a novel method for whole-body geometric calibration of humanoid robots using a single plane, embedded sensors, and an admittance controller, introducing the IROC algorithm for optimal posture selection that achieved 2.3x accuracy improvement on the TALOS robot."
